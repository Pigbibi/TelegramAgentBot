name: Dependabot Auto Merge
on:
  workflow_run:
    workflows: ["Secret Scan", "Repository hygiene", "Check", "Dependabot update policy"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    name: Merge verified Dependabot patches
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
      statuses: read
    steps:
      # workflow_run uses only the trusted default branch, never the PR checkout or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge the verified current head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-policy.cjs merge
