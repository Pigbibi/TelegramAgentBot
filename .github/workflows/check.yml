name: Check
on:
  push:
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv sync --all-extras
      - name: Formatter
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
      - name: Lint
        run: uv run pyright src/telegram_agent_bot/
      - name: Test
        run: uv run pytest --tb=short -q
  test-summary:
    # Stable name for the required status check: the matrix above expands into
    # "check (3.12)" / "check (3.13)", which change whenever the matrix changes.
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          echo "check result: $CHECK_RESULT"
          test "$CHECK_RESULT" = "success"
