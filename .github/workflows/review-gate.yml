name: Review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-gate:
    uses: QuantStrategyLab/.github/.github/workflows/governance-acceptance.yml@a267ab46389b19c88e552efe64f8f9b1cc7753ff
    with:
      pr-number: ${{ github.event.pull_request.number }}
      policy-revision: a267ab46389b19c88e552efe64f8f9b1cc7753ff
      mode: SHADOW
