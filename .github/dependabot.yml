version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
  - package-ecosystem: pip
    directory: /plugins/socket_backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
