[project]
name = "telegram-agent-bot"
version = "2.0.0"
description = "Telegram bot for monitoring Codex CLI / Claude Code sessions via tmux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "libtmux>=0.37.0",
    "Pillow>=13.0.0",
    "aiofiles>=24.0.0",
    "mistletoe>=1.6.0,<1.7.0",
    "telegramify-markdown>=1.4.2,<2.0.0",
]

[project.scripts]
telegram-agent-bot = "telegram_agent_bot.main:main"
telegram-agent-bridge = "telegram_agent_bot.bridge:main"

[project.entry-points."telegram_agent_bot.backends"]
local = "telegram_agent_bot.backends.local:LocalTmuxBackend"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_agent_bot"]

# Target Python 3.12
[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep core rules explicit and enforce bugbear + complexity <= 15 on new code.
select = ["E4", "E7", "E9", "F", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Frozen legacy complexity hotspots; new modules extracted from bot.py must stay <= 15.
"src/telegram_agent_bot/bot.py" = ["C901"]
"src/telegram_agent_bot/config.py" = ["C901"]
"src/telegram_agent_bot/handlers/history.py" = ["C901"]
"src/telegram_agent_bot/handlers/message_queue.py" = ["C901"]
"src/telegram_agent_bot/handlers/status_polling.py" = ["C901"]
"src/telegram_agent_bot/hook.py" = ["C901"]
"src/telegram_agent_bot/screenshot.py" = ["C901"]
"src/telegram_agent_bot/session.py" = ["C901"]
"src/telegram_agent_bot/session_monitor.py" = ["C901"]
"src/telegram_agent_bot/tmux_manager.py" = ["C901"]
"src/telegram_agent_bot/transcript_parser.py" = ["C901"]
"tests/*.py" = ["B", "C901"]

[tool.pytest.ini_options]
addopts = ["-p", "no:libtmux"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests using real filesystem or external processes",
]

[tool.coverage.run]
source = ["telegram_agent_bot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "logger\\.",
]
